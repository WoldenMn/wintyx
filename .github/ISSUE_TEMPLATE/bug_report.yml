name: Signaler un bug
description: Un comportement inattendu, un plantage ou une valeur fausse dans Wintyx
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Une faille de sécurité ne se signale pas ici : passez par l'onglet **Security**, puis **Report a vulnerability**.
        Relisez les journaux avant de les coller : ils peuvent contenir des chemins ou des noms propres à votre machine.
  - type: input
    id: version
    attributes:
      label: Version de Wintyx
      description: Page « À propos ».
      placeholder: "x.y.z"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Version de Windows
      description: Résultat de `winver`.
      placeholder: "Windows 11 24H2, build 26100"
    validations:
      required: true
  - type: dropdown
    id: admin
    attributes:
      label: Droits administrateur
      options:
        - Lancé en administrateur
        - Lancé sans droits administrateur
        - Je ne sais pas
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir la page Nettoyage
        2. Cliquer sur « Analyser »
        3. ...
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Résultat attendu et résultat observé
    validations:
      required: true
  - type: textarea
    id: journal
    attributes:
      label: Extrait du journal
      description: Fichiers de `%LOCALAPPDATA%\Wintyx\Logs\`, seulement les lignes utiles.
      render: text
